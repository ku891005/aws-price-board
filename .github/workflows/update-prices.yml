name: Update AWS prices

on:
  schedule:
    # 매주 월요일 00:20 UTC (= 한국시간 월요일 09:20)
    - cron: "20 0 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "docs/index.html"
      - ".github/workflows/update-prices.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openpyxl (엑셀 산출물용)
        run: pip install --quiet openpyxl

      - name: Collect prices (Seoul)
        env:
          AWS_PRICE_REGION: ap-northeast-2
        run: python scripts/collect_prices.py --refresh --xlsx

      - name: Build standalone HTML
        run: python scripts/build_standalone.py --out docs/aws-price-board-standalone.html

      - name: Upload xlsx / log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-xlsx
          path: |
            RDS_SQLServer_Pricing_*.xlsx
            docs/aws-price-board-standalone.html
            collect_log.txt
          if-no-files-found: warn

      - name: Commit data if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "no price changes"
          else
            git commit -m "chore: update AWS price data ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
